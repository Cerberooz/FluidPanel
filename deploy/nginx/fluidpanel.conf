# FluidPanel production Nginx virtual host.
#
# Install on Ubuntu with:
#   sudo cp deploy/nginx/fluidpanel.conf /etc/nginx/sites-available/fluidpanel
#   sudo ln -s /etc/nginx/sites-available/fluidpanel /etc/nginx/sites-enabled/fluidpanel
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is also the default site, so direct IP access remains available.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name panel.fluxservers.cloud;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Flux Status uses the same VPS IP. Add the appropriate TLS configuration with
# Certbot after status.fluxservers.cloud is pointed at this server.
server {
    listen 80;
    listen [::]:80;
    server_name status.fluxservers.cloud;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
