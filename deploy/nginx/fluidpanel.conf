# FluidPanel production Nginx virtual host.
#
# Install on Ubuntu with:
#   sudo cp deploy/nginx/fluidpanel.conf /etc/nginx/sites-available/fluidpanel
#   sudo ln -s /etc/nginx/sites-available/fluidpanel /etc/nginx/sites-enabled/fluidpanel
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change server_name to your domain once DNS is configured.
# "_" accepts direct IP access while the panel has no domain.
server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /home/fluxseverseu/panel/public;
    index index.php;

    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
