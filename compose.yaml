services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-panel}
      MYSQL_USER: ${DB_USERNAME:-panel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  panel:
    build:
      context: .
      dockerfile: Dockerfile.flux
    restart: unless-stopped
    # Only the VPS Nginx proxy listens publicly. This avoids changing the
    # existing panel IP and lets Nginx route both domains by hostname.
    ports:
      - "127.0.0.1:18080:80"
    env_file:
      - .env
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.flux
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.flux
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - panel_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  status:
    build:
      context: ./Flux Status/Flux Status
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:5000"
    env_file:
      - ./Flux Status/Flux Status/.env
    environment:
      PANEL_URL: http://panel
    depends_on:
      - panel

volumes:
  mariadb_data:
    name: fluidpanel_mariadb_data
  redis_data:
    name: fluidpanel_redis_data
  panel_storage:
    name: fluidpanel_storage
